# ===== Sistema de pedidos para cafeteria universitaria =====
# Evidencia 6 - Caso 4 - Prototipo funcional minimo

spring.application.name=cafeteria-pedidos
server.port=8080

# ===== Base de datos H2 en memoria =====
spring.datasource.url=jdbc:h2:mem:cafeteriadb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Consola web de H2 (evidencia visual de datos): http://localhost:8080/h2-console =====
# JDBC URL en la consola: jdbc:h2:mem:cafeteriadb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
